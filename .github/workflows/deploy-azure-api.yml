name: Deploy Azure API (App Service)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure workflow inputs
        id: validate
        run: |
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing required value: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.validate.outputs.should_deploy == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Enforce Node runtime on App Service
        if: steps.validate.outputs.should_deploy == 'true'
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --linux-fx-version "NODE|20-lts"

      - name: Enforce API app settings for mock launch
        if: steps.validate.outputs.should_deploy == 'true'
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings \
              LEAD_INTEL_MOCK_MODE=true \
              DATABASE_URL=sqlite:///home/site/wwwroot/data/lead_intel.db \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true

      - name: Deploy API to Azure App Service
        if: steps.validate.outputs.should_deploy == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Verify API health
        if: steps.validate.outputs.should_deploy == 'true'
        run: |
          url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/api/health"
          echo "API URL: $url"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url"; then
              echo
              echo "API health check passed."
              exit 0
            fi
            echo "Health check retry $i/5..."
            sleep 8
          done
          echo "API health check failed."
          exit 1

      - name: Skip deploy summary
        if: steps.validate.outputs.should_deploy != 'true'
        run: |
          echo "Azure API deployment skipped. Configure repository secrets/variables first."
